name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build-and-rls:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # Áp migration + seed lên project Supabase test (secrets.SUPABASE_DB_URL).
      - name: Apply migrations + seed (Supabase test)
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: |
          npx supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
          npm run seed

      - name: Build
        run: npm run build

      - name: Test RLS (cách ly tenant)
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: |
          npm run test:rls -- --reporter=json --outputFile=rls-report.json
          COUNT=$(node -e "console.log(require('./rls-report.json').numTotalTests)")
          echo "Đã chạy $COUNT test RLS."
          # 136 test tính tới 07-01. Sàn 120 để không vỡ vì thêm/bớt vài test, nhưng vẫn chặn
          # trường hợp bộ test im lặng không chạy mà CI vẫn xanh (thiếu secrets, file đổi tên,
          # describe bị .skip) — cổng như vậy không bảo vệ gì.
          if [ "$COUNT" -lt 120 ]; then
            echo "::error::Chỉ $COUNT test RLS chạy — ma trận cách ly tenant không được phép bỏ qua."
            exit 1
          fi

  # ── Lệch schema: production có thứ mà repo không mô tả? ──────────────────────
  # QD-013: ngày 23–24/09/2026 mất nửa ngày vì view `bills_revenue`, 9 hàm báo cáo và một trigger
  # chỉ tồn tại trên production, trong khi `db push` vẫn báo "up to date".
  #
  # Dùng snapshot thay `supabase db diff` vì db diff cần Docker dựng shadow DB — máy dev không có,
  # nên không ai chạy thử được trước khi đẩy lên CI, mà cổng chặn chưa ai chạy thử thì không đáng
  # tin. Cách này chạy được ở cả local lẫn CI, và ĐÃ kiểm đối chứng âm hai chiều (xem
  # 40-KiemTra/OPS-07-DoiChungAm.md).
  schema-drift:
    runs-on: ubuntu-latest
    env:
      POSTGRES_URL_NON_POOLING: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: So schema production với snapshot đã commit
        if: ${{ env.POSTGRES_URL_NON_POOLING != '' }}
        run: npm run schema:check
